name: Garten und Kueche - Android Debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify pure-Java lifecycle and care randomization
        run: |
          mkdir -p build/care-test
          javac -d build/care-test \
            tests/care/PlantStore.java \
            app/src/main/java/de/naehe/gartenkueche/CareRules.java \
            app/src/main/java/de/naehe/gartenkueche/CareEngine.java \
            tests/care/CareEngineTest.java
          java -cp build/care-test de.naehe.gartenkueche.CareEngineTest
      - name: Build independent APK (Android 6+)
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Garten-und-Kueche-Lab-0.0.3-Parallel-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
