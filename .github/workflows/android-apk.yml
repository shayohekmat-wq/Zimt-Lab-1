name: Garten und Kueche - Android Debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify pure-Java lifecycle and care randomization
        run: |
          mkdir -p build/care-test
          javac -d build/care-test \
            tests/care/PlantStore.java \
            app/src/main/java/de/naehe/gartenkueche/CareRules.java \
            app/src/main/java/de/naehe/gartenkueche/CareEngine.java \
            tests/care/CareEngineTest.java
          java -cp build/care-test de.naehe.gartenkueche.CareEngineTest
      - name: Test forgiving multi-stroke contour detection
        run: |
          mkdir -p build/contour-test
          javac -d build/contour-test \
            app/src/main/java/de/naehe/gartenkueche/ContourDetector.java \
            tests/care/ContourDetectorTest.java
          java -cp build/contour-test de.naehe.gartenkueche.ContourDetectorTest
      - name: Test complete plant-art stem, coloring, crop and save pipeline
        run: |
          mkdir -p build/open-stroke-test
          javac -d build/open-stroke-test \
            tests/plant-art-stubs/android/graphics/Color.java \
            tests/plant-art-stubs/android/graphics/Bitmap.java \
            app/src/main/java/de/naehe/gartenkueche/ContourDetector.java \
            app/src/main/java/de/naehe/gartenkueche/SpriteGeometry.java \
            app/src/main/java/de/naehe/gartenkueche/PlantArt.java \
            tests/care/PlantArtOpenStrokeTest.java
          java -cp build/open-stroke-test de.naehe.gartenkueche.PlantArtOpenStrokeTest
      - name: Test multi-contour sprite geometry and virtual time
        run: |
          mkdir -p build/geometry-test
          javac -d build/geometry-test \
            app/src/main/java/de/naehe/gartenkueche/SpriteGeometry.java \
            app/src/main/java/de/naehe/gartenkueche/VirtualTimeMath.java \
            tests/care/SpriteGeometryTest.java \
            tests/care/VirtualTimeMathTest.java
          java -cp build/geometry-test de.naehe.gartenkueche.SpriteGeometryTest
          java -cp build/geometry-test de.naehe.gartenkueche.VirtualTimeMathTest
      - name: Test non-destructive atelier stage and contour workflow
        run: |
          mkdir -p build/atelier-test
          javac -d build/atelier-test \
            tests/plant-art-stubs/android/graphics/Color.java \
            tests/plant-art-stubs/android/graphics/Bitmap.java \
            app/src/main/java/de/naehe/gartenkueche/ContourDetector.java \
            app/src/main/java/de/naehe/gartenkueche/PlantArt.java \
            app/src/main/java/de/naehe/gartenkueche/AtelierDocument.java \
            app/src/main/java/de/naehe/gartenkueche/AtelierSnapshot.java \
            app/src/main/java/de/naehe/gartenkueche/AtelierHistory.java \
            tests/care/AtelierWorkflowTest.java
          java -cp build/atelier-test de.naehe.gartenkueche.AtelierWorkflowTest
      - name: Build independent APK (Android 6+)
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify package allows side-by-side installation
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "name='de.naehe.app.gartenkueche.lab10'"
      - uses: actions/upload-artifact@v4
        with:
          name: Garten-und-Kueche-v0.0.10-Atelier-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
